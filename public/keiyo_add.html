<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>駅を追加する</title>
</head>
<body>
    <form action="/keiyo_add">
        <label for="id">ID</label>
        <input type="number" name="id" id="id" required>

        <label for="code">Code</label>
        <input type="text" name="code" id="code" required>

        <label for="name">駅名</label>
        <input type="text" name="name" id="name" required>

        <input type="submit" value="登録">
    </form>
    <p><a href="/keiyo" style="display:inline-block;padding:8px 18px;background:#43a047;color:#fff;text-decoration:none;border-radius:6px;">一覧を見る</a></p>
</body>
</html>
